apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: kapita
  labels:
    app: api-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: api-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: kapita
  labels:
    app: api-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api
          image: kapita-api-service:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          # Non-sensitive environment configuration from ConfigMap
          envFrom:
            - configMapRef:
                name: kapita-config
          # Sensitive credentials isolated in Kubernetes Secret
          env:
            - name: DB_PRIMARY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kapita-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_REPLICA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kapita-secrets
                  key: POSTGRES_PASSWORD
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kapita-secrets
                  key: KEYCLOAK_CLIENT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
