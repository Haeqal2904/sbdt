apiVersion: v1
kind: ConfigMap
metadata:
  name: kapita-config
  namespace: kapita
  labels:
    app.kubernetes.io/part-of: distributed-db-sso-ml
data:
  # Database Single Endpoint Hostnames (DNS Discovery via Service / Headless Service)
  DB_PRIMARY_HOST: "postgres-primary.kapita.svc.cluster.local"
  DB_PRIMARY_PORT: "5432"
  DB_PRIMARY_NAME: "app_db"
  DB_PRIMARY_USER: "app_user"

  DB_REPLICA_HOST: "postgres-replica.kapita.svc.cluster.local"
  DB_REPLICA_PORT: "5432"
  DB_REPLICA_NAME: "app_db"
  DB_REPLICA_USER: "app_user"

  # Keycloak SSO Configurations (Internal DNS & External Ingress URL)
  KEYCLOAK_INTERNAL_URL: "http://keycloak-service.kapita.svc.cluster.local:8080"
  KEYCLOAK_EXTERNAL_URL: "http://auth.lokal"
  KEYCLOAK_REALM: "kapita-realm"
  KEYCLOAK_CLIENT_ID: "api-client"

  # Machine Learning Model Path
  MODEL_PATH: "model/model.joblib"
---
apiVersion: v1
kind: Secret
metadata:
  name: kapita-secrets
  namespace: kapita
  labels:
    app.kubernetes.io/part-of: distributed-db-sso-ml
type: Opaque
stringData:
  POSTGRES_PASSWORD: "app_password"
  REPLICATION_PASSWORD: "replica_password"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  KEYCLOAK_CLIENT_SECRET: "api-client-secret-12345"
