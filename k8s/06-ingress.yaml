apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kapita-ingress
  namespace: kapita
  labels:
    app.kubernetes.io/name: kapita-ingress
    app.kubernetes.io/part-of: distributed-db-sso-ml
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    # 1. SSO / Identity Provider Routing (Keycloak)
    - host: auth.lokal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080

    # 2. Backend Microservice & ML Inference API Routing (FastAPI)
    - host: api.lokal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8000

    # Alias *.localhost (resolves to 127.0.0.1 automatically in browsers without editing /etc/hosts)
    - host: auth.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
    - host: api.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8000

